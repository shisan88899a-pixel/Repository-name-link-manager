<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>链接管理工具</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><b>链接组</b><nav><button onclick="toggleUsers()">管理员 · 用户管理</button><span>{{username}} · {{'管理员' if role=='admin' else '子账户'}}</span><button id="theme">主题</button><a href="/export.csv">导出链接</a><a href="/logout">退出</a></nav></header>
<main>
<section id="userPanel" class="card" style="display:none"><h3>管理员 · 用户管理</h3><div class="useradd"><input id="newUser" placeholder="子账户用户名"><input id="newPass" type="password" placeholder="密码（至少6位）"><select id="newRole"><option value="user">子账户</option><option value="admin">管理员</option></select><button class="primary" onclick="addUser()">增加账户</button></div><div id="userMsg" class="msg"></div><div class="tablewrap small"><table><thead><tr><th>用户名</th><th>权限</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
<section class="stats"><div><b id="sTotal">0</b><span>总链接数</span></div><div><b id="sToday">0</b><span>今日新增</span></div><div><b id="sWithdraw">0</b><span>今日撤回</span></div><div><b id="sUsers">0</b><span>账户数量</span></div></section>
<section class="card"><h3>用户数据统计</h3><div class="tablewrap small"><table><thead><tr><th>用户</th><th>账户类型</th><th>增加数量</th><th>撤回数量</th><th>重复数量</th></tr></thead><tbody id="userStatsBody"></tbody></table></div></section>
<section class="grid2"><div class="card"><h3>单条检查并新增</h3><textarea id="single" placeholder="粘贴一条网址链接"></textarea><div class="right"><button class="primary" onclick="checkAdd()">检查并新增</button></div><div id="checkMsg" class="msg">☑ 等待检查</div></div><div class="card"><h3>TXT / CSV 批量导入</h3><p>支持 TXT / CSV，可导入任意网站链接；支持一行一个或一行多个链接。</p><div class="fileline"><input type="file" id="file" accept=".txt,.csv"><button class="primary" onclick="importFile()">开始导入</button></div><div id="importMsg" class="msg">☑ 有导入权限</div></div></section>
<section class="card"><h3>查看用户新增链接</h3><label>选择用户</label><div class="toolbar"><select id="userSelect" onchange="loadLinks()"></select><span id="countText"></span><button onclick="loadLinks()">刷新</button></div><div class="tablewrap"><table><thead><tr><th>新增时间</th><th>链接</th><th>操作</th></tr></thead><tbody id="linksBody"></tbody></table></div></section>
<section class="card"><h3>最近100条新增历史</h3><p>管理员可查看全部；子账户只能查看自己的链接。</p><div class="tablewrap history"><table><thead><tr><th>时间</th><th>用户</th><th>链接</th><th>状态</th><th>操作</th></tr></thead><tbody id="historyBody"></tbody></table></div></section>
</main><script><style>
@keyframes checkingPulse{
  from{background:#16a34a;transform:scale(1)}
  to{background:#22c55e;transform:scale(1.06)}
}
</style>
const ROLE={{role|tojson}}, ME={{username|tojson}};const $=s=>document.querySelector(s);const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function refreshUsers(){let d=await fetch('/api/stats').then(r=>r.json());document.querySelector('#sTotal').textContent=(d.total??0).toLocaleString();document.querySelector('#sToday').textContent=(d.today??0).toLocaleString();document.querySelector('#sWithdraw').textContent=(d.withdrawn??0).toLocaleString();document.querySelector('#sUsers').textContent=(d.user_count??0).toLocaleString();let tb=document.querySelector('#userStats');if(tb){tb.innerHTML=(d.per_user||[]).map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role==='admin'?'管理员':'子账户'}</td><td style="color:green">${(u.added??0).toLocaleString()}</td><td>${(u.withdrawn??0).toLocaleString()}</td><td style="color:red">${(u.duplicates??0).toLocaleString()}</td></tr>`).join('')}}
async function checkAdd(){let ta=document.querySelector('textarea');let btn=ta.parentElement.querySelector('button');let old=btn.textContent;btn.disabled=true;btn.textContent='检查中...';btn.style.background='#16a34a';btn.style.animation='checkingPulse .55s infinite alternate';try{let r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:ta.value})});let d=await r.json();checkMsg.textContent=d.message||'';checkMsg.style.color=d.added?'green':'red';await refreshAll()}catch(e){checkMsg.textContent='检查失败，请重试';checkMsg.style.color='red'}finally{btn.disabled=false;btn.textContent=old;btn.style.background='';btn.style.animation=''}}
async function importFile(){let f=file.files[0];if(!f){importMsg.textContent='请选择 TXT 或 CSV 文件';return}let fd=new FormData();fd.append('file',f);fd.append('user',userSelect.value);importMsg.textContent='正在导入…';let d=await fetch('/api/import',{method:'POST',body:fd}).then(r=>r.json());importMsg.textContent=`完成：新增 ${d.added} 条，重复 ${d.duplicates} 条，无效 ${d.invalid} 条`;await refreshAll()}
async function loadLinks(){let u=userSelect.value||ME,d=await fetch('/api/links?user='+encodeURIComponent(u)).then(r=>r.json());countText.textContent=`${u} 共新增 ${d.count.toLocaleString()} 条；当前显示最近 ${d.items.length} 条。`;linksBody.innerHTML=d.items.map(x=>`<tr><td>${esc(x.created_at)}</td><td class="url">${esc(x.url)}</td><td><button class="danger" onclick="withdraw(${x.id})">撤回</button></td></tr>`).join('')}
async function loadHistory(){let d=await fetch('/api/history').then(r=>r.json());historyBody.innerHTML=d.items.map(x=>`<tr><td>${esc(x.created_at.slice(5))}</td><td>${esc(x.username)}</td><td class="url">${esc(x.url)}</td><td class="valid">有效</td><td><button class="danger" onclick="withdraw(${x.id})">撤回</button></td></tr>`).join('')}
async function withdraw(id){if(!confirm('确定撤回这条链接吗？撤回后会从有效链接中删除。'))return;let d=await fetch('/api/delete/'+id,{method:'DELETE'}).then(r=>r.json());if(!d.ok)alert(d.message||'撤回失败');await refreshAll()}
function toggleUsers(){if(ROLE!=='admin'){alert('仅管理员可以管理账户');return}userPanel.style.display=userPanel.style.display==='none'?'block':'none';if(userPanel.style.display==='block')loadUserAdmin()}
async function loadUserAdmin(){let d=await fetch('/api/users').then(r=>r.json());usersBody.innerHTML=(d.items||[]).map(x=>`<tr><td>${esc(x.username)}</td><td>${x.role==='admin'?'管理员':'子账户'}</td><td>${esc(x.created_at)}</td><td>${x.username===ME?'当前账户':`<button onclick="resetPass(${x.id})">改密码</button> <button class="danger" onclick="delUser(${x.id})">删除</button>`}</td></tr>`).join('')}
async function addUser(){let d=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:newUser.value,password:newPass.value,role:newRole.value})}).then(r=>r.json());userMsg.textContent=d.ok?'☑ 账户已增加':'⚠ '+d.message;if(d.ok){newUser.value='';newPass.value='';await loadUserAdmin();await refreshUsers()}}
async function resetPass(id){let p=prompt('输入新密码（至少6位）');if(!p)return;let d=await fetch('/api/users/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}).then(r=>r.json());alert(d.ok?'密码已修改':d.message)}
async function delUser(id){if(!confirm('确定删除这个登录账户吗？该账户已录入的链接不会删除。'))return;let d=await fetch('/api/users/'+id,{method:'DELETE'}).then(r=>r.json());if(!d.ok)alert(d.message);await loadUserAdmin();await refreshUsers()}
async function refreshAll(){await refreshUsers();await Promise.all([loadLinks(),loadHistory()])}theme.onclick=()=>document.body.classList.toggle('dark');refreshAll();
</script></body></html>
