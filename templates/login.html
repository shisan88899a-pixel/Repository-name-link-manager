<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="loginbox card"><h2>Jiaolong 链接组 · 登录</h2><input id="u" placeholder="用户名" value="十三"><input id="p" type="password" placeholder="密码"><button class="primary" onclick="go()">登录</button><div id="m" class="err"></div><p>首次运行默认管理员：十三 / 123456</p></div><script>async function go(){let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(d.ok)location='/';else m.textContent=d.message}p.onkeydown=e=>{if(e.key==='Enter')go()}</script></body></html>
